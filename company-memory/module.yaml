        "miniapp_id": "memory-query-console",
        "miniapp_version": "5"
      },
      {
        "key": "index",
        "miniapp_id": "memory-index-console",
        "miniapp_version": "3"
      },
      {
        "key": "search",
        "miniapp_id": "memory-search-console",
        "miniapp_version": "3"
      }
    ]
  },
  "requires": {
    "mcp": [
      {
        "name": "company_memory",
        "required_tools": [
          "memory.entities.upsert",
          "memory.query"
