{
  "$schema": "agentmaurice.module/v2",
  "schema_version": 2,
  "key": "company-memory",
  "name": "Company Memory",
  "description": "Manual document memory based on explicit sources and reviews.",
  "version": "0.3.2",
  "provides": {
    "actions": [
      {
        "key": "capture_source",
        "workflow_id": "memory-capture-source",
