      },
      {
        "key": "propose_update",
        "workflow_id": "memory-propose-update",
        "workflow_version": "5"
      },
      {
        "key": "review_update",
        "workflow_id": "memory-review-update",
        "workflow_version": "7"
      },
      {
        "key": "index_revision",
        "workflow_id": "memory-index-revision",
        "workflow_version": "9"
      }
    ],
    "queries": [
      {
        "key": "inspect",
        "workflow_id": "memory-inspect",
        "workflow_version": "5"
      },
      {
        "key": "query",
        "workflow_id": "memory-query",
        "workflow_version": "8"
      },
      {
        "key": "health",
        "workflow_id": "memory-health",
        "workflow_version": "4"
